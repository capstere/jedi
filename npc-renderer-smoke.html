<!doctype html><meta charset="utf-8"><title>Kenney conversion visual verification</title><style>body{margin:0;background:#e7edeb;font:14px system-ui}canvas{display:block}#thumbs{display:flex}#thumbs>div{text-align:center}</style><canvas id="view" width="1200" height="650"></canvas><div id="thumbs"></div><script src="../source/npc-assets.js"></script><script src="../source/npc-renderer.js"></script><script>
const c=document.querySelector('#view'),gl=c.getContext('webgl2',{preserveDrawingBuffer:true}),r=createNpcRenderer({gl});
const norm=a=>{let n=Math.hypot(...a);return a.map(v=>v/n)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),eye=[3.6,2.8,7],target=[0,.85,0],z=norm(eye.map((v,i)=>v-target[i])),x=norm(cross([0,1,0],z)),y=cross(z,x),view=[x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1],f=1/Math.tan(40*Math.PI/360),p=[f/(1200/650),0,0,0,0,f,0,0,0,0,-1.002,-1,0,0,-.2002,0],vp=new Float32Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)for(let k=0;k<4;k++)vp[col*4+row]+=p[k*4+row]*view[col*4+k];
const people=r.variants.map((v,i)=>({id:'p'+i,x:(i-1.5)*1.2,z:0,height:v.height,appearance:v.id,yaw:0,state:i===0?'idle':i===1?'walk':i===2?'gesture':'phone',phase:.28+i*.06}));
gl.viewport(0,0,1200,650);gl.clearColor(.88,.92,.91,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);r.draw(people,{vp,eye,quality:'high'});
for(const v of r.variants){const box=document.createElement('div'),th=document.createElement('canvas');r.thumbnail(th,v.id);box.append(th,document.createTextNode(v.label));document.querySelector('#thumbs').append(box)}window.test={gl,r,people,vp,eye};
</script>
