name: Stabilize Hissrum mobile HUD regression
on:
  push:
    branches: [feat/hissrum-riposte-combat-hud-v8]
    paths: ['.github/workflows/hissrum-v8-test-input.yml']
permissions:
  contents: write
jobs:
  adjust:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hissrum-riposte-combat-hud-v8
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hold the physical touch through actual firing rather than tap between slow software GPU frames
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/hissrum-strike/tests/browser-smoke.cjs');s=p.read_text()
          old='''  await mobile.locator('[data-touch="fire"]').tap();
            await mobile.waitForFunction(()=>window.__hissrumDiagnostics().magazine<30,null,{timeout:45000});'''
          old=old.replace('\n            await','\n  await')
          new='''  // Hold an actual touch until Game registers a shot. A tap can start
            // and end between software-WebGL frames without ever being sampled.
            const fireBounds=await mobile.locator('[data-touch="fire"]').boundingBox();
            assert.ok(fireBounds);
            const heldTouch=await phone.newCDPSession(mobile);
            await heldTouch.send('Input.dispatchTouchEvent',{type:'touchStart',touchPoints:[{
              x:fireBounds.x+fireBounds.width/2,y:fireBounds.y+fireBounds.height/2,id:7
            }]});
            try{
              await mobile.waitForFunction(()=>window.__hissrumDiagnostics().magazine<30,null,{timeout:45000});
            }finally{
              await heldTouch.send('Input.dispatchTouchEvent',{type:'touchEnd',touchPoints:[]});
              await heldTouch.detach();
            }'''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.split('\n'))
          assert old in s,'Expected manual firing regression block was not found'
          p.write_text(s.replace(old,new,1))
          css=Path('games/hissrum-strike/style.css')
          css.write_text(css.read_text()+'\n/* Allow portrait/landscape scoreboard scrolling without enabling gameplay gestures. */\n#scoreboard{touch-action:pan-y;overscroll-behavior:contain}\n')
          PY
          node --check games/hissrum-strike/tests/browser-smoke.cjs
          node --test games/hissrum-strike/tests/*.test.mjs
      - name: Commit only game and regression fixes
        run: |
          git add games/hissrum-strike/tests/browser-smoke.cjs games/hissrum-strike/style.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Wait for actual touch-fired shot in mobile HUD regression and enable scoreboard scroll'
          git push origin HEAD:refs/heads/feat/hissrum-riposte-combat-hud-v8
