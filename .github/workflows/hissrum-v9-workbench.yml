name: Hissrum v9 workbench
on:
  push:
    branches: [feat/hissrum-cartridge-tank-v9]
    paths: ['.github/workflows/hissrum-v9-workbench.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hissrum-cartridge-tank-v9
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local-review checksum and apply only game changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          packed=''.join(Path(f'.work/v9-patch-{i}.b64').read_text().strip() for i in range(4))
          data=gzip.decompress(base64.b64decode(packed,validate=True))
          actual=hashlib.sha256(data).hexdigest()
          assert actual=='62ebb8f7d3f08ee8824b38266a76143cd228a298e64ceb97d1efe57ca10f687b',actual
          print('Verified locally reviewed source patch:',actual)
          p=Path('/tmp/hissrum-v9.patch');p.write_bytes(data)
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
          find games/hissrum-strike/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check games/hissrum-strike/tests/browser-smoke.cjs
          node --test games/hissrum-strike/tests/*.test.mjs
      - name: Commit reviewed source and remove temporary patch material
        run: |
          rm .work/v9-patch-*.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/hissrum-strike .work
          git commit -m 'Add tested Cartridge tank, armor combat, fixed-pad respawn and directional Death01 animation'
          git push origin HEAD:refs/heads/feat/hissrum-cartridge-tank-v9
