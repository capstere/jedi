name: Hissrum v9 workbench
on:
  push:
    branches: [feat/hissrum-cartridge-tank-v9]
    paths: ['.github/workflows/hissrum-v9-workbench.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact pinned browser dependency for offline QA
        run: |
          mkdir -p qa-runtime
          for name in three.module.js three.core.js; do
            curl -fLsS --retry 3 --max-time 45 "https://cdn.jsdelivr.net/npm/three@0.180.0/build/$name" -o "qa-runtime/$name"
          done
          test -s qa-runtime/three.core.js
      - uses: actions/upload-artifact@v4
        with:
          name: hissrum-v9-qa-runtime
          path: qa-runtime/
          retention-days: 1
