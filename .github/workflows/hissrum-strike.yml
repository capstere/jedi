name: Hissrum Strike verification
concurrency:
  group: hissrum-strike-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feat/hissrum12-mini-strike]
    paths:
      - 'games/hissrum-strike/**'
      - 'Hissrum12_V5_med_39_objekt.glb'
      - '.github/workflows/hissrum-strike.yml'
  pull_request:
    paths:
      - 'games/hissrum-strike/**'
      - 'Hissrum12_V5_med_39_objekt.glb'
      - '.github/workflows/hissrum-strike.yml'
jobs:
  integrity:
    name: Syntax, model and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Hissrum 12 source model geometry
        run: python3 games/hissrum-strike/tests/inspect_glb.py
      - name: Check module syntax
        run: find games/hissrum-strike/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Run deterministic navigation and model tests
        run: node --test games/hissrum-strike/tests/*.test.mjs

  browser:
    name: Real GLB / Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Load the real GLB and play a smoke round
        run: node games/hissrum-strike/tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hissrum-strike-browser
          path: hissrum-strike-browser.png
          if-no-files-found: ignore
