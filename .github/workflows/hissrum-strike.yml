name: Hissrum Strike verification
concurrency:
  group: hissrum-strike-v8-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    branches: [main, feat/hissrum12-mini-strike]
    paths:
      - 'games/hissrum-strike/**'
      - 'Hissrum12_V5_med_39_objekt.glb'
      - '.github/workflows/hissrum-strike.yml'
  pull_request:
    paths:
      - 'games/hissrum-strike/**'
      - 'Hissrum12_V5_med_39_objekt.glb'
      - '.github/workflows/hissrum-strike.yml'
jobs:
  integrity:
    name: Syntax, model and navigation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit real GLB scene geometry and materials
        run: python3 games/hissrum-strike/tests/model-audit.py
      - name: Check module syntax
        run: find games/hissrum-strike/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Check test-runner source syntax before installing Chromium
        run: |
          node --check games/hissrum-strike/tests/browser-smoke.cjs
          node --check games/hissrum-strike/tests/grenade-view-browser.cjs
      - name: Run deterministic navigation and model tests
        run: node --test games/hissrum-strike/tests/*.test.mjs

  browser:
    name: Real GLB / Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright browser runner
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '45000'
        run: |
          npm install --no-save --no-package-lock --fetch-timeout=30000 --fetch-retries=2 playwright@1.56.1 pngjs@7.0.0
          npx playwright install chromium
          # Hosted Ubuntu already provides the browser libraries in most runs.
          # Avoid unrelated full apt upgrades unless a real launch needs them.
          if ! node -e "require('playwright').chromium.launch({headless:true,args:['--no-sandbox']}).then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})"; then
            npx playwright install-deps chromium
          fi
      - name: Verify grenade buffer reuse and tank preview guard in Chromium
        timeout-minutes: 2
        run: node games/hissrum-strike/tests/grenade-view-browser.cjs
      - name: Load the real GLB and play a smoke round
        run: node games/hissrum-strike/tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hissrum-strike-browser
          path: |
            hissrum-strike-browser.png
            hissrum-strike-mobile.png
            hissrum-strike-sniper.png
            hissrum-strike-p9-hands.png
            hissrum-strike-blood-dwarfs.png
            hissrum-strike-cartridge-tank-mobile.png
            hissrum-strike-cartridge-wreck.png
            hissrum-strike-scoreboard-mobile.png
            hissrum-strike-combat-feedback.png
          if-no-files-found: ignore
