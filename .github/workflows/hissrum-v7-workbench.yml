name: Hissrum v7 workbench
on:
  push:
    branches: [feat/hissrum-mobile-arsenal-v7]
    paths: ['.github/workflows/hissrum-v7-workbench.yml', 'tools/hissrum-v7-patch.py']
permissions:
  contents: write
jobs:
  workbench:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hissrum-mobile-arsenal-v7
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed integration changes if present
        run: |
          if test -f tools/hissrum-v7-patch.py; then
            python3 tools/hissrum-v7-patch.py
            find games/hissrum-strike/src -name '*.mjs' -print0 | xargs -0 -n1 node --check
            node --test games/hissrum-strike/tests/*.test.mjs
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add games/hissrum-strike
            if ! git diff --cached --quiet; then
              git commit -m 'Integrate tested mobile autofire, progressive recoil, arsenal and agile flight'
              git push origin HEAD:refs/heads/feat/hissrum-mobile-arsenal-v7
            fi
          fi
      - name: Prepare inspectable development snapshot
        run: |
          tar -czf /tmp/hissrum-v7-source.tar.gz games/hissrum-strike Hissrum12_V5_med_39_objekt.glb .github/workflows/hissrum-strike.yml
      - uses: actions/upload-artifact@v4
        with:
          name: hissrum-v7-source
          path: /tmp/hissrum-v7-source.tar.gz
          retention-days: 3
