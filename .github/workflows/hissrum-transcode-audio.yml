name: Produce Safari-compatible audio fallback
on:
  push:
    branches: [feat/hissrum-audio-blood-dwarfs-flying-bots]
    paths: ['.github/workflows/hissrum-transcode-audio.yml']
permissions:
  contents: write
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hissrum-audio-blood-dwarfs-flying-bots
          persist-credentials: true
      - name: Prepare mobile Safari MP3 fallback for CC0 OGG samples
        run: |
          set -euo pipefail
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for source in games/hissrum-strike/assets/audio/*.ogg; do
            # This ambient sound has OGG chain metadata that can make ffmpeg
            # read indefinitely. Ambient is already synthesized on iPhone.
            if [[ "$source" == *computerNoise_000.ogg ]]; then
              echo "Ambient stays OGG; synthesized loop is available on Safari"
              continue
            fi
            echo "Converting $(basename "$source") (max 12 seconds)"
            if timeout -s KILL 12s ffmpeg -hide_banner -loglevel error -nostdin -threads 1 \
              -y -t 4 -i "$source" -map_metadata -1 -ac 1 -codec:a libmp3lame \
              -q:a 7 "${source%.ogg}.mp3"; then
              test -s "${source%.ogg}.mp3"
            else
              echo "Warning: audio transcoder skipped $(basename "$source")"
              rm -f "${source%.ogg}.mp3"
            fi
          done
          count="$(find games/hissrum-strike/assets/audio -maxdepth 1 -name '*.mp3' | wc -l)"
          echo "Safari fallbacks generated: $count"
          test "$count" -ge 10
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/hissrum-strike/assets/audio/*.mp3
          if ! git diff --staged --quiet; then
            git commit -m "Provide AAC-free MP3 fallbacks for Kenney CC0 sounds on iPhone Safari"
            git push origin HEAD:refs/heads/feat/hissrum-audio-blood-dwarfs-flying-bots
          fi
